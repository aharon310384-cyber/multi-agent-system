name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 72.56.109.22
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/multi-agent-system
            git fetch --all --prune
            git reset --hard origin/main
            npm ci --omit=dev
            # Открываем новый порт в ufw (если ufw активен — добавим, иначе no-op).
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
              ufw allow 38731/tcp || true
            fi
            # Полный пересоздание процесса, чтобы env (включая PORT) применились корректно.
            export PORT=38731
            if pm2 describe multi-agent > /dev/null 2>&1; then
              pm2 delete multi-agent || true
            fi
            pm2 start npm --name multi-agent --update-env -- start
            pm2 save
            # Ждём, пока сервер начнёт слушать (до 30 секунд).
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:38731/api/health > /tmp/deploy-health.json 2>/dev/null; then
                break
              fi
              sleep 2
            done
            cat /tmp/deploy-health.json
            # После успешного healthcheck закрываем старый порт 3000.
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
              ufw delete allow 3000/tcp || true
            fi
